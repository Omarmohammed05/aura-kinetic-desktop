name: Release Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact_name: mac-installer
            pattern: dist/*.dmg
          - os: windows-latest
            script: dist:win
            artifact_name: win-installer
            pattern: dist/*.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Verify git tag matches package.json version
        shell: bash
        run: |
          node -e "
            const pkg = require('./package.json');
            const expected = 'v' + pkg.version;
            const actual = process.env.GITHUB_REF_NAME;
            if (actual !== expected) {
              console.error('Tag mismatch: expected ' + expected + ', got ' + actual);
              process.exit(1);
            }
            console.log('Verified tag matches package.json version: ' + actual);
          "

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built installers
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        working-directory: release-artifacts
        run: |
          ls -la
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/SHA256SUMS.txt
