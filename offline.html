<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>Aura Kinetic ERP — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
        background: #f2f2f4;
        color: #111116;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0b0f;
          color: #f4f4f6;
        }
        .card {
          background: #14141c;
          border-color: rgba(255, 255, 255, 0.1);
        }
        .muted {
          color: #a1a1aa;
        }
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 36px 28px;
        border-radius: 28px;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #0b0b0f;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #d9f99d;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.35;
      }
      .en-title {
        margin: 0 0 14px;
        font-size: 16px;
        font-weight: 600;
        direction: ltr;
      }
      .muted {
        margin: 0 0 10px;
        font-size: 14px;
        line-height: 1.6;
        color: #52525b;
      }
      .en {
        direction: ltr;
      }
      button {
        margin-top: 20px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 999px;
        background: #0b0b0f;
        color: #d9f99d;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }
      button:hover {
        opacity: 0.92;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true"><span class="dot"></span></div>
      <h1>تعذّر الاتصال بخادم Aura Kinetic</h1>
      <p class="en-title">Unable to connect to Aura Kinetic</p>
      <p class="muted">تحقق من اتصال الإنترنت ثم أعد المحاولة.</p>
      <p class="muted en">Please check your internet connection and try again.</p>
      <button id="retryBtn" type="button">إعادة المحاولة / Retry</button>
    </main>
    <script>
      document.getElementById('retryBtn').addEventListener('click', function () {
        if (window.auraDesktop && typeof window.auraDesktop.retry === 'function') {
          window.auraDesktop.retry();
        } else {
          window.location.reload();
        }
      });
    </script>
  </body>
</html>
